<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="520" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="bold" fill="#333333">Same failing batch, three internal paths</text>
  <text x="24" y="50" font-size="12" fill="#333333">call_a succeeds after 50ms; call_b raises immediately</text>

  <!-- COLUMN 1: LangGraph -->
  <rect x="24" y="70" width="240" height="420" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="24" y="70" width="240" height="46" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="40" y="90" font-size="13" font-weight="bold" fill="#333333">LangGraph ToolNode</text>
  <text x="40" y="107" font-size="12" fill="#333333">langgraph-prebuilt 1.1.0</text>

  <rect x="44" y="134" width="200" height="30" fill="#f0f0f0" stroke="#333333"/>
  <text x="144" y="154" font-size="12" fill="#333333" text-anchor="middle">asyncio.gather(*coros)</text>
  <text x="144" y="180" font-size="12" font-style="italic" fill="#333333" text-anchor="middle">no return_exceptions</text>

  <path d="M 144 190 L 144 210" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="44" y="212" width="200" height="46" fill="#ffffff" stroke="#333333"/>
  <text x="144" y="231" font-size="12" fill="#333333" text-anchor="middle">first exception wins,</text>
  <text x="144" y="248" font-size="12" fill="#333333" text-anchor="middle">siblings' results dropped</text>

  <path d="M 144 258 L 144 278" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="44" y="280" width="200" height="46" fill="#f0f0f0" stroke="#333333"/>
  <text x="144" y="299" font-size="12" fill="#333333" text-anchor="middle">sibling task NOT cancelled</text>
  <text x="144" y="316" font-size="12" fill="#333333" text-anchor="middle">it finishes later, unrecorded</text>

  <path d="M 144 326 L 144 346" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="44" y="348" width="200" height="60" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="144" y="372" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">0 tool messages</text>
  <text x="144" y="392" font-size="12" fill="#333333" text-anchor="middle">orphans: call_a, call_b</text>

  <text x="44" y="432" font-size="12" fill="#333333">escape hatch:</text>
  <text x="44" y="450" font-size="12" fill="#333333">handle_tool_errors=True</text>
  <text x="44" y="468" font-size="12" font-style="italic" fill="#333333">pairs the batch</text>

  <!-- COLUMN 2: Agents SDK -->
  <rect x="280" y="70" width="240" height="420" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="280" y="70" width="240" height="46" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="296" y="90" font-size="13" font-weight="bold" fill="#333333">OpenAI Agents SDK</text>
  <text x="296" y="107" font-size="12" fill="#333333">openai-agents 0.19.4</text>

  <rect x="300" y="134" width="200" height="46" fill="#f0f0f0" stroke="#333333"/>
  <text x="400" y="153" font-size="12" fill="#333333" text-anchor="middle">default_tool_error_function</text>
  <text x="400" y="170" font-size="12" fill="#333333" text-anchor="middle">exception becomes tool output</text>

  <path d="M 400 180 L 400 200" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="300" y="202" width="200" height="30" fill="#ffffff" stroke="#333333"/>
  <text x="400" y="222" font-size="12" fill="#333333" text-anchor="middle">batch stays paired</text>

  <text x="400" y="252" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">if you disable it:</text>

  <rect x="300" y="262" width="200" height="46" fill="#f0f0f0" stroke="#333333"/>
  <text x="400" y="281" font-size="12" fill="#333333" text-anchor="middle">isolate_parallel_failures</text>
  <text x="400" y="298" font-size="12" fill="#333333" text-anchor="middle">defaults to len(tool_runs) &gt; 1</text>

  <path d="M 400 308 L 400 328" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="300" y="330" width="200" height="62" fill="#ffffff" stroke="#333333"/>
  <text x="400" y="349" font-size="12" fill="#333333" text-anchor="middle">partition pending tasks:</text>
  <text x="400" y="366" font-size="12" fill="#333333" text-anchor="middle">pre-invoke → cancel</text>
  <text x="400" y="383" font-size="12" fill="#333333" text-anchor="middle">post-invoke → wait, bounded</text>

  <path d="M 400 392 L 400 410" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="300" y="412" width="200" height="44" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="431" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">drain, then re-raise</text>
  <text x="400" y="448" font-size="12" fill="#333333" text-anchor="middle">sibling saw CancelledError</text>

  <!-- COLUMN 3: Pydantic AI -->
  <rect x="536" y="70" width="240" height="420" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="536" y="70" width="240" height="46" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="552" y="90" font-size="13" font-weight="bold" fill="#333333">Pydantic AI</text>
  <text x="552" y="107" font-size="12" fill="#333333">pydantic-ai-slim 2.27.0</text>

  <rect x="556" y="134" width="200" height="46" fill="#f0f0f0" stroke="#333333"/>
  <text x="656" y="153" font-size="12" fill="#333333" text-anchor="middle">on interruption, keep the</text>
  <text x="656" y="170" font-size="12" fill="#333333" text-anchor="middle">partial tool returns</text>

  <path d="M 656 180 L 656 200" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="556" y="202" width="200" height="46" fill="#ffffff" stroke="#333333"/>
  <text x="656" y="221" font-size="12" fill="#333333" text-anchor="middle">call_a result survives,</text>
  <text x="656" y="238" font-size="12" fill="#333333" text-anchor="middle">call_b left dangling</text>

  <path d="M 656 248 L 656 268" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="556" y="270" width="200" height="46" fill="#f0f0f0" stroke="#333333"/>
  <text x="656" y="289" font-size="12" fill="#333333" text-anchor="middle">on the next request:</text>
  <text x="656" y="306" font-size="12" fill="#333333" text-anchor="middle">_repair_dangling_tool_calls</text>

  <path d="M 656 316 L 656 336" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="556" y="338" width="200" height="62" fill="#ffffff" stroke="#333333"/>
  <text x="656" y="357" font-size="12" fill="#333333" text-anchor="middle">synthesize ToolReturnPart</text>
  <text x="656" y="374" font-size="12" fill="#333333" text-anchor="middle">outcome='interrupted'</text>
  <text x="656" y="391" font-size="12" fill="#333333" text-anchor="middle">marked as synthesized</text>

  <path d="M 656 400 L 656 418" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="556" y="420" width="200" height="44" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="656" y="439" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">history is sendable</text>
  <text x="656" y="456" font-size="12" fill="#333333" text-anchor="middle">deterministic, idempotent</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
