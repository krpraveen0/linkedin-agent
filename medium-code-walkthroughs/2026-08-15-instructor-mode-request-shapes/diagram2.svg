<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">The mode you request is resolved against the provider</text>

  <!-- Requested mode -->
  <rect x="24" y="110" width="170" height="70" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="109" y="140" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">You request</text>
  <text x="109" y="162" font-size="12" fill="#333333" text-anchor="middle">Mode.TOOLS_STRICT</text>

  <!-- Registry / capability map -->
  <rect x="256" y="96" width="236" height="98" rx="6" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="374" y="124" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Provider capability map</text>
  <text x="374" y="148" font-size="12" fill="#333333" text-anchor="middle">(v2 registry, per provider)</text>
  <text x="374" y="172" font-size="12" fill="#333333" text-anchor="middle">TOOLS_STRICT  =>  TOOLS</text>

  <!-- Resolved handler -->
  <rect x="556" y="110" width="180" height="70" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="646" y="140" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Handler runs</text>
  <text x="646" y="162" font-size="12" fill="#333333" text-anchor="middle">plain TOOLS request</text>

  <!-- arrows -->
  <line x1="194" y1="145" x2="254" y2="145" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="145" x2="554" y2="145" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- note -->
  <text x="380" y="238" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">No error is raised: a mode a provider doesn't support quietly falls back.</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
