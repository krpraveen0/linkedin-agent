<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="440" fill="#ffffff"/>
  <text x="280" y="28" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Where Chroma stays silent about your distance metric</text>

  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Box 1 -->
  <rect x="150" y="48" width="260" height="52" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="70" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">create_collection(name)</text>
  <text x="280" y="89" font-size="12" fill="#333333" text-anchor="middle">no space set  ->  space = l2 (squared)</text>

  <line x1="280" y1="100" x2="280" y2="128" stroke="#333333" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- Box 2 -->
  <rect x="150" y="130" width="260" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="152" font-size="13" fill="#333333" text-anchor="middle">query() ranks by squared L2</text>
  <text x="280" y="171" font-size="12" fill="#333333" text-anchor="middle">magnitude-sensitive: wrong order for text</text>

  <line x1="280" y1="182" x2="280" y2="210" stroke="#333333" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- Box 3: the silent ignore -->
  <rect x="110" y="212" width="340" height="56" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="234" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">get_or_create_collection(name, configuration=cosine)</text>
  <text x="280" y="256" font-size="12" fill="#333333" text-anchor="middle">collection exists  ->  config ignored, still l2  (no error)</text>

  <line x1="280" y1="268" x2="280" y2="296" stroke="#333333" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- Box 4: modify refused -->
  <rect x="110" y="298" width="340" height="56" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="320" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">modify(configuration=cosine)</text>
  <text x="280" y="342" font-size="12" fill="#333333" text-anchor="middle">InvalidArgumentError: unknown field `space`  (immutable)</text>

  <line x1="280" y1="354" x2="280" y2="382" stroke="#333333" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- Box 5: only fix -->
  <rect x="110" y="384" width="340" height="44" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="411" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Only fix: delete + recreate + re-add every embedding</text>
</svg>
