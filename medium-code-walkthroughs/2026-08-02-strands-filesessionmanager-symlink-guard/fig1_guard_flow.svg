<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">How a session_id becomes a file (and where the two guards sit)</text>

  <!-- Step 1: session_id -->
  <rect x="20" y="70" width="130" height="60" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="85" y="95" font-size="13" fill="#333333" text-anchor="middle">caller-supplied</text>
  <text x="85" y="113" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">session_id</text>

  <!-- arrow -->
  <line x1="150" y1="100" x2="195" y2="100" stroke="#333333" stroke-width="1.5"/>
  <polygon points="195,95 205,100 195,105" fill="#333333"/>

  <!-- Step 2: guard 1 -->
  <rect x="205" y="65" width="150" height="70" fill="#e0e0e0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="280" y="88" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">Guard 1: _identifier</text>
  <text x="280" y="106" font-size="12" fill="#333333" text-anchor="middle">basename(id) == id ?</text>
  <text x="280" y="124" font-size="11" fill="#333333" text-anchor="middle">rejects "a/b", "../x"</text>

  <!-- arrow -->
  <line x1="355" y1="100" x2="400" y2="100" stroke="#333333" stroke-width="1.5"/>
  <polygon points="400,95 410,100 400,105" fill="#333333"/>

  <!-- Step 3: path -->
  <rect x="410" y="70" width="150" height="60" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="485" y="94" font-size="12" fill="#333333" text-anchor="middle">path built:</text>
  <text x="485" y="112" font-size="11" fill="#333333" text-anchor="middle">session_&lt;id&gt;/session.json</text>

  <!-- arrow -->
  <line x1="560" y1="100" x2="605" y2="100" stroke="#333333" stroke-width="1.5"/>
  <polygon points="605,95 615,100 605,105" fill="#333333"/>

  <!-- Step 4: guard 2 -->
  <rect x="545" y="175" width="155" height="80" fill="#e0e0e0" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="622" y="198" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">Guard 2 (new 1.48)</text>
  <text x="622" y="216" font-size="12" fill="#333333" text-anchor="middle">os.path.islink(path)?</text>
  <text x="622" y="234" font-size="11" fill="#333333" text-anchor="middle">yes -&gt; refuse</text>
  <text x="622" y="249" font-size="11" fill="#333333" text-anchor="middle">no -&gt; open / rename</text>

  <!-- connector from path down to guard2 -->
  <line x1="615" y1="130" x2="615" y2="160" stroke="#333333" stroke-width="1.5"/>
  <line x1="615" y1="160" x2="622" y2="160" stroke="#333333" stroke-width="1.5"/>
  <line x1="622" y1="160" x2="622" y2="173" stroke="#333333" stroke-width="1.5"/>
  <polygon points="617,173 622,183 627,173" fill="#333333"/>

  <!-- outputs -->
  <rect x="300" y="200" width="150" height="40" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="375" y="225" font-size="12" fill="#333333" text-anchor="middle">read / write JSON</text>
  <line x1="545" y1="220" x2="452" y2="220" stroke="#333333" stroke-width="1.5"/>
  <polygon points="452,215 442,220 452,225" fill="#333333"/>

  <rect x="300" y="255" width="240" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3" rx="4"/>
  <text x="420" y="277" font-size="12" fill="#333333" text-anchor="middle">ValueError / SessionException (blocked)</text>
</svg>
