<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">Discover, reveal, call</text>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Call 1 -->
  <rect x="30" y="56" width="700" height="96" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="46" y="78" font-size="13" font-weight="bold" fill="#333333">Call 1</text>
  <text x="46" y="98" font-size="12" fill="#333333">model sees 1 tool: [search_tools]</text>
  <rect x="330" y="66" width="180" height="30" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="420" y="86" font-size="12" fill="#333333" text-anchor="middle">calls search_tools(["weather"])</text>
  <line x1="510" y1="81" x2="556" y2="81" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="560" y="66" width="150" height="30" fill="#e0e0e0" stroke="#333333" stroke-width="1"/>
  <text x="635" y="86" font-size="11" fill="#333333" text-anchor="middle">reveals get_weather</text>
  <text x="46" y="132" font-size="12" fill="#333333" font-style="italic">returns {'discovered_tools': [{'name': 'get_weather'}]} — the only match</text>

  <line x1="380" y1="152" x2="380" y2="176" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Call 2 -->
  <rect x="30" y="180" width="700" height="96" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="46" y="202" font-size="13" font-weight="bold" fill="#333333">Call 2</text>
  <text x="46" y="222" font-size="12" fill="#333333">model sees 2 tools: [get_weather, search_tools]</text>
  <rect x="330" y="190" width="180" height="30" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="420" y="210" font-size="12" fill="#333333" text-anchor="middle">calls get_weather("Paris")</text>
  <line x1="510" y1="205" x2="556" y2="205" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="560" y="190" width="150" height="30" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="635" y="210" font-size="11" fill="#333333" text-anchor="middle">"sunny, 24C"</text>
  <text x="46" y="256" font-size="12" fill="#333333" font-style="italic">convert_currency and search_flights are still hidden</text>

  <line x1="380" y1="276" x2="380" y2="300" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Call 3 -->
  <rect x="30" y="304" width="700" height="72" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="46" y="326" font-size="13" font-weight="bold" fill="#333333">Call 3</text>
  <text x="46" y="346" font-size="12" fill="#333333">model writes final answer: "The weather in Paris is sunny, 24C."</text>
  <text x="46" y="366" font-size="12" fill="#333333" font-style="italic">a revealed tool stays available for the rest of the run</text>

  <text x="380" y="404" font-size="12" fill="#333333" text-anchor="middle">Search scopes the reveal: only tools matching the query become visible.</text>
</svg>
