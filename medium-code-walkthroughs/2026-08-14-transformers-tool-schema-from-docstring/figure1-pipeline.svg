<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">How a Python function becomes prompt text in Transformers 5.x</text>

  <!-- Box 1: Python function -->
  <rect x="20" y="70" width="150" height="90" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="95" y="100" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Python function</text>
  <text x="95" y="122" font-size="12" fill="#333333" text-anchor="middle">docstring +</text>
  <text x="95" y="140" font-size="12" fill="#333333" text-anchor="middle">type hints</text>

  <!-- Box 2: get_json_schema -->
  <rect x="215" y="70" width="160" height="90" rx="6" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="295" y="104" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">get_json_schema()</text>
  <text x="295" y="128" font-size="12" fill="#333333" text-anchor="middle">parses + validates</text>

  <!-- Box 3: JSON schema -->
  <rect x="420" y="70" width="150" height="90" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="495" y="104" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">JSON tool schema</text>
  <text x="495" y="128" font-size="12" fill="#333333" text-anchor="middle">name, description,</text>
  <text x="495" y="146" font-size="12" fill="#333333" text-anchor="middle">params, enum</text>

  <!-- Box 4: Prompt -->
  <rect x="615" y="70" width="125" height="90" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="677" y="104" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Prompt text</text>
  <text x="677" y="128" font-size="12" fill="#333333" text-anchor="middle">the model</text>
  <text x="677" y="146" font-size="12" fill="#333333" text-anchor="middle">reads</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
  <line x1="170" y1="115" x2="212" y2="115" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="115" x2="417" y2="115" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="115" x2="612" y2="115" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="60" font-size="11" fill="#333333" text-anchor="middle">via apply_chat_template(tools=[...])</text>

  <!-- Rejection branch -->
  <rect x="215" y="210" width="160" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="295" y="235" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Underdocumented?</text>
  <text x="295" y="255" font-size="12" fill="#333333" text-anchor="middle">raises, does not ship</text>
  <line x1="295" y1="160" x2="295" y2="207" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="192" font-size="11" fill="#333333" text-anchor="start">DocstringParsingException /</text>
  <text x="410" y="208" font-size="11" fill="#333333" text-anchor="start">TypeHintParsingException</text>
</svg>
