<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <text x="360" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#333333">Where does deepagents write_file() send the bytes?</text>

  <!-- model tool call -->
  <rect x="40" y="70" width="200" height="60" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="140" y="95" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">model tool call</text>
  <text x="140" y="115" font-size="12" text-anchor="middle" fill="#333333">write_file(file_path, content)</text>

  <!-- middleware -->
  <rect x="290" y="70" width="200" height="60" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="390" y="95" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">FilesystemMiddleware</text>
  <text x="390" y="115" font-size="12" text-anchor="middle" fill="#333333">routes to a backend</text>

  <line x1="240" y1="100" x2="288" y2="100" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- default branch -->
  <line x1="390" y1="130" x2="200" y2="205" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="165" font-size="12" font-style="italic" text-anchor="middle" fill="#333333">backend=None (default)</text>

  <rect x="40" y="210" width="300" height="110" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="235" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">StateBackend</text>
  <text x="190" y="258" font-size="12" text-anchor="middle" fill="#333333">stores under the "files" state key</text>
  <text x="190" y="277" font-size="12" text-anchor="middle" fill="#333333">ephemeral · lives in LangGraph state</text>
  <text x="190" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">nothing written to disk</text>

  <!-- explicit branch -->
  <line x1="390" y1="130" x2="540" y2="205" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="165" font-size="12" font-style="italic" text-anchor="middle" fill="#333333">backend=FilesystemBackend(...)</text>

  <rect x="400" y="210" width="280" height="110" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="540" y="235" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">FilesystemBackend</text>
  <text x="540" y="258" font-size="12" text-anchor="middle" fill="#333333">writes real files on disk</text>
  <text x="540" y="277" font-size="12" text-anchor="middle" fill="#333333">virtual_mode=True by default (0.7.0)</text>
  <text x="540" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">anchored under root_dir</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
