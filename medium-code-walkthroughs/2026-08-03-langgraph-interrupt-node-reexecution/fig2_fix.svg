<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">The fix: ask first, act second</text>
  <text x="360" y="52" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">nothing above interrupt() has a side effect, so the replay has nothing to duplicate</text>

  <!-- Wrong: side effect above -->
  <rect x="40" y="75" width="290" height="185" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/>
  <text x="185" y="98" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Before  (fires twice)</text>
  <rect x="70" y="112" width="230" height="38" fill="#e0e0e0" stroke="#333333" stroke-width="2.5"/>
  <text x="185" y="136" font-size="12" fill="#333333" text-anchor="middle">charge_card()   x2</text>
  <line x1="185" y1="150" x2="185" y2="168" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="70" y="170" width="230" height="34" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="185" y="192" font-size="12" fill="#333333" text-anchor="middle">interrupt("Approve?")</text>
  <line x1="185" y1="204" x2="185" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="70" y="222" width="230" height="30" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="185" y="242" font-size="12" fill="#333333" text-anchor="middle">return</text>

  <!-- Right: side effect below -->
  <rect x="390" y="75" width="290" height="185" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/>
  <text x="535" y="98" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">After  (fires once)</text>
  <rect x="420" y="112" width="230" height="34" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="535" y="134" font-size="12" fill="#333333" text-anchor="middle">interrupt("Approve?")</text>
  <line x1="535" y1="146" x2="535" y2="164" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="420" y="166" width="230" height="38" fill="#e0e0e0" stroke="#333333" stroke-width="2.5"/>
  <text x="535" y="190" font-size="12" fill="#333333" text-anchor="middle">charge_card()   x1</text>
  <line x1="535" y1="204" x2="535" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="420" y="222" width="230" height="30" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="535" y="242" font-size="12" fill="#333333" text-anchor="middle">return</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
