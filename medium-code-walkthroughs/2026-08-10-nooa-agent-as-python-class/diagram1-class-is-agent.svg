<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">In NOOA, the class is the agent</text>

  <!-- Left: the Python class -->
  <rect x="30" y="60" width="300" height="270" fill="#f0f0f0" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="48" y="88" font-size="13" font-family="Menlo, Consolas, monospace" fill="#333333">class TicketTriage(nooa.Agent):</text>
  <text x="60" y="120" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">"""You are a triage agent."""</text>
  <text x="60" y="160" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">open_tickets: int = 3</text>
  <text x="60" y="200" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">async def urgent_count(</text>
  <text x="76" y="220" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">self, tickets: list[dict]</text>
  <text x="60" y="240" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">) -> int:</text>
  <text x="76" y="260" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">"""Count high-priority."""</text>
  <text x="76" y="282" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">...</text>
  <text x="76" y="304" font-size="11" font-family="Menlo, Consolas, monospace" fill="#666666"># empty body = ask the model</text>

  <!-- Arrows to the right column -->
  <!-- Right: agent concepts -->
  <g font-size="13" fill="#333333">
    <rect x="470" y="72" width="220" height="34" fill="#e0e0e0" stroke="#333333" stroke-width="1.2" rx="4"/>
    <text x="580" y="94" text-anchor="middle">docstring → system prompt</text>

    <rect x="470" y="144" width="220" height="34" fill="#e0e0e0" stroke="#333333" stroke-width="1.2" rx="4"/>
    <text x="580" y="166" text-anchor="middle">field → agent state</text>

    <rect x="470" y="216" width="220" height="34" fill="#e0e0e0" stroke="#333333" stroke-width="1.2" rx="4"/>
    <text x="580" y="238" text-anchor="middle">type hints → contract</text>

    <rect x="470" y="288" width="220" height="34" fill="#e0e0e0" stroke="#333333" stroke-width="1.2" rx="4"/>
    <text x="580" y="310" text-anchor="middle">`...` body → LLM call</text>
  </g>

  <!-- connector lines -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <line x1="330" y1="115" x2="470" y2="89" marker-end="url(#arrow)"/>
    <line x1="330" y1="158" x2="470" y2="161" marker-end="url(#arrow)"/>
    <line x1="330" y1="235" x2="470" y2="233" marker-end="url(#arrow)"/>
    <line x1="330" y1="285" x2="470" y2="305" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
