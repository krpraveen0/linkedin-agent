<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">What @action does the moment it wraps your function</text>

  <!-- Step 1 -->
  <rect x="250" y="52" width="220" height="42" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="78" text-anchor="middle" font-size="13" fill="#333333">@action(reads=[...]) wraps fn</text>

  <!-- skip gate: empty reads -->
  <rect x="250" y="116" width="220" height="42" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="135" text-anchor="middle" font-size="12.5" fill="#333333">reads declared? and a param</text>
  <text x="360" y="151" text-anchor="middle" font-size="12.5" fill="#333333">annotated : State found?</text>

  <!-- skip box -->
  <rect x="520" y="116" width="180" height="42" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="610" y="135" text-anchor="middle" font-size="12" fill="#333333">no -> skip check</text>
  <text x="610" y="151" text-anchor="middle" font-size="12" fill="#333333">(nothing validated)</text>

  <!-- Step 2 getsource -->
  <rect x="250" y="180" width="220" height="42" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="206" text-anchor="middle" font-size="13" fill="#333333">inspect.getsource(fn)</text>

  <!-- Step 3 ast.parse -->
  <rect x="250" y="244" width="220" height="42" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="263" text-anchor="middle" font-size="13" fill="#333333">ast.parse -> walk tree for</text>
  <text x="360" y="279" text-anchor="middle" font-size="12.5" fill="#333333">literal state["key"] subscripts</text>

  <!-- Step 4 compare -->
  <rect x="250" y="308" width="220" height="42" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="334" text-anchor="middle" font-size="13" fill="#333333">every key in declared reads?</text>

  <!-- outcome pass -->
  <rect x="120" y="386" width="230" height="52" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="235" y="409" text-anchor="middle" font-size="12.5" fill="#333333">yes -> action is created</text>
  <text x="235" y="426" text-anchor="middle" font-size="12.5" fill="#333333">(build and run as usual)</text>

  <!-- outcome fail -->
  <rect x="380" y="386" width="270" height="52" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="515" y="409" text-anchor="middle" font-size="12.5" fill="#333333">no -> raise ValueError at</text>
  <text x="515" y="426" text-anchor="middle" font-size="12.5" fill="#333333">decoration: "undeclared state keys"</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#333333"/>
    </marker>
  </defs>
  <line x1="360" y1="94" x2="360" y2="114" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="137" x2="518" y2="137" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="158" x2="360" y2="178" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="222" x2="360" y2="242" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="286" x2="360" y2="306" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="350" x2="250" y2="384" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="350" x2="470" y2="384" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
