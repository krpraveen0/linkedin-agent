<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">The @action contract is enforced on one side only</text>

  <!-- READS column -->
  <rect x="40" y="56" width="300" height="270" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">reads=["turn", "limit"]</text>

  <rect x="70" y="104" width="240" height="40" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="129" text-anchor="middle" font-size="12.5" fill="#333333">source parsed at decoration</text>

  <rect x="70" y="164" width="240" height="40" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="189" text-anchor="middle" font-size="12.5" fill="#333333">literal state["key"] compared</text>

  <rect x="70" y="224" width="240" height="56" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="247" text-anchor="middle" font-size="12.5" fill="#333333">undeclared read -> ValueError</text>
  <text x="190" y="265" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">CHECKED (with 2 blind spots)</text>

  <!-- WRITES column -->
  <rect x="380" y="56" width="300" height="270" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">writes=["turn"]</text>

  <rect x="410" y="104" width="240" height="40" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="129" text-anchor="middle" font-size="12.5" fill="#333333">no source analysis</text>

  <rect x="410" y="164" width="240" height="40" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="189" text-anchor="middle" font-size="12.5" fill="#333333">state.update(turn=..., log=...)</text>

  <rect x="410" y="224" width="240" height="56" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="247" text-anchor="middle" font-size="12.5" fill="#333333">undeclared "log" persists</text>
  <text x="530" y="265" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">NOT CHECKED</text>

  <text x="360" y="348" text-anchor="middle" font-size="11.5" fill="#333333">Blind spots: only literal subscripts are seen, and only when a parameter is annotated : State</text>
</svg>
