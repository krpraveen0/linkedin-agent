<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="380" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">How model2vec turns a sentence into one vector</text>

  <!-- Step 1: sentence -->
  <rect x="24" y="70" width="150" height="46" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="99" y="92" font-size="13" fill="#333333" text-anchor="middle">"the dog bit</text>
  <text x="99" y="108" font-size="13" fill="#333333" text-anchor="middle">the man"</text>
  <text x="99" y="135" font-size="12" fill="#333333" text-anchor="middle">sentence</text>

  <!-- arrow -->
  <line x1="174" y1="93" x2="214" y2="93" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 2: token ids -->
  <rect x="216" y="70" width="150" height="46" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="291" y="90" font-size="13" fill="#333333" text-anchor="middle">[the, dog, bit,</text>
  <text x="291" y="107" font-size="13" fill="#333333" text-anchor="middle">the, man]</text>
  <text x="291" y="135" font-size="12" fill="#333333" text-anchor="middle">tokenize</text>

  <!-- arrow -->
  <line x1="366" y1="93" x2="406" y2="93" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 3: lookup table -->
  <rect x="408" y="58" width="170" height="82" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="493" y="76" font-size="12" fill="#333333" text-anchor="middle">static lookup table</text>
  <line x1="418" y1="84" x2="568" y2="84" stroke="#333333" stroke-width="0.8"/>
  <text x="428" y="99" font-size="11" fill="#333333">the  → v(the)</text>
  <text x="428" y="114" font-size="11" fill="#333333">dog  → v(dog)</text>
  <text x="428" y="129" font-size="11" fill="#333333">bit  → v(bit) ...</text>
  <text x="493" y="158" font-size="12" fill="#333333" text-anchor="middle">one fixed vector / token</text>

  <!-- arrow -->
  <line x1="578" y1="99" x2="618" y2="99" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 4: mean -->
  <rect x="620" y="70" width="118" height="60" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="2.2"/>
  <text x="679" y="95" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">mean(axis=0)</text>
  <text x="679" y="115" font-size="11" fill="#333333" text-anchor="middle">average tokens</text>

  <!-- arrow down to sentence vector -->
  <line x1="679" y1="130" x2="679" y2="176" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="600" y="178" width="158" height="40" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="679" y="203" font-size="13" fill="#333333" text-anchor="middle">one sentence vector</text>

  <!-- callout: order lost -->
  <rect x="470" y="250" width="270" height="56" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="605" y="272" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Word order is lost here</text>
  <text x="605" y="292" font-size="12" fill="#333333" text-anchor="middle">a mean does not depend on order</text>
  <line x1="605" y1="250" x2="660" y2="132" stroke="#333333" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- No attention note -->
  <text x="30" y="272" font-size="12" fill="#333333">No transformer. No attention.</text>
  <text x="30" y="290" font-size="12" fill="#333333">Just table lookups and an average.</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
