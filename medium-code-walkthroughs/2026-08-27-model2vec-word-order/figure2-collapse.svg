<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="380" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">Same words, any order, one point in space</text>

  <!-- Left: two opposite sentences -->
  <rect x="24" y="66" width="250" height="44" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="149" y="93" font-size="13" fill="#333333" text-anchor="middle">"the dog bit the man"</text>

  <rect x="24" y="150" width="250" height="44" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="149" y="177" font-size="13" fill="#333333" text-anchor="middle">"the man bit the dog"</text>

  <text x="149" y="222" font-size="12" fill="#333333" text-anchor="middle">same 5 tokens, reversed meaning</text>

  <!-- arrows converging to same point -->
  <line x1="274" y1="88" x2="470" y2="126" stroke="#333333" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="274" y1="172" x2="470" y2="134" stroke="#333333" stroke-width="1.5" marker-end="url(#ah2)"/>
  <text x="360" y="108" font-size="12" fill="#333333" text-anchor="middle">encode()</text>

  <!-- Right: embedding space -->
  <rect x="470" y="60" width="266" height="230" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="603" y="80" font-size="12" fill="#333333" text-anchor="middle">embedding space</text>

  <!-- single merged point for both -->
  <circle cx="560" cy="130" r="8" fill="#333333"/>
  <text x="560" y="120" font-size="12" fill="#333333" text-anchor="middle">both sentences</text>
  <text x="560" y="156" font-size="11" fill="#333333" text-anchor="middle">cos = 0.9999999</text>

  <!-- different-words point far away -->
  <circle cx="670" cy="240" r="7" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="648" y="262" font-size="11" fill="#333333" text-anchor="middle">"the cat</text>
  <text x="648" y="276" font-size="11" fill="#333333" text-anchor="middle">chased the mouse"</text>

  <!-- distance line -->
  <line x1="568" y1="136" x2="662" y2="234" stroke="#333333" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="638" y="188" font-size="11" fill="#333333" text-anchor="middle">cos = 0.57</text>

  <!-- bottom takeaway -->
  <rect x="24" y="256" width="420" height="60" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="234" y="279" font-size="13" fill="#333333" text-anchor="middle">The model knows which words you used.</text>
  <text x="234" y="299" font-size="13" fill="#333333" text-anchor="middle">It does not know in what order you used them.</text>

  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
