<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">How semantic-router scores one route</text>

  <!-- Query -->
  <rect x="24" y="150" width="150" height="52" rx="6" fill="#f0f0f0" stroke="#333333"/>
  <text x="99" y="172" font-size="12" fill="#333333" text-anchor="middle">query text</text>
  <text x="99" y="190" font-size="11" fill="#333333" text-anchor="middle">"how do i get a refund"</text>

  <!-- arrow -->
  <line x1="174" y1="176" x2="214" y2="176" stroke="#333333" stroke-width="1.5"/>
  <polygon points="214,176 206,172 206,180" fill="#333333"/>

  <!-- Per-utterance scores -->
  <text x="330" y="70" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">cosine score per example utterance</text>
  <g font-size="11" fill="#333333">
    <rect x="216" y="82"  width="228" height="26" rx="4" fill="#f0f0f0" stroke="#333333"/>
    <text x="224" y="99" text-anchor="start">"how do i get a refund"</text>
    <text x="436" y="99" text-anchor="end" font-weight="bold">0.816</text>

    <rect x="216" y="112" width="228" height="26" rx="4" fill="#f0f0f0" stroke="#333333"/>
    <text x="224" y="129" text-anchor="start">"please cancel my subscription"</text>
    <text x="436" y="129" text-anchor="end">0.126</text>

    <rect x="216" y="142" width="228" height="26" rx="4" fill="#f0f0f0" stroke="#333333"/>
    <text x="224" y="159" text-anchor="start">"the charge on my card looks wrong"</text>
    <text x="436" y="159" text-anchor="end">0.167</text>

    <rect x="216" y="172" width="228" height="26" rx="4" fill="#f0f0f0" stroke="#333333"/>
    <text x="224" y="189" text-anchor="start">"i want to close my account"</text>
    <text x="436" y="189" text-anchor="end">0.272</text>
  </g>

  <!-- brace to aggregation -->
  <line x1="444" y1="140" x2="484" y2="140" stroke="#333333" stroke-width="1.5"/>
  <polygon points="484,140 476,136 476,144" fill="#333333"/>

  <!-- Aggregation box -->
  <rect x="486" y="112" width="118" height="56" rx="6" fill="#e0e0e0" stroke="#333333"/>
  <text x="545" y="134" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">aggregation</text>
  <text x="545" y="151" font-size="11" fill="#333333" text-anchor="middle">mean (default)</text>
  <text x="545" y="164" font-size="10" fill="#333333" text-anchor="middle">= 0.345</text>

  <!-- arrow to gate -->
  <line x1="604" y1="140" x2="640" y2="140" stroke="#333333" stroke-width="1.5"/>
  <polygon points="640,140 632,136 632,144" fill="#333333"/>

  <!-- Threshold gate -->
  <rect x="642" y="106" width="96" height="68" rx="6" fill="#f0f0f0" stroke="#333333"/>
  <text x="690" y="128" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">threshold</text>
  <text x="690" y="144" font-size="11" fill="#333333" text-anchor="middle">0.345 &lt; 0.40</text>
  <text x="690" y="162" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">SKIPPED</text>

  <!-- Note row -->
  <text x="380" y="250" font-size="12" fill="#333333" text-anchor="middle">The best utterance still scores 0.816, but the mean of all four is 0.345.</text>
  <text x="380" y="270" font-size="12" fill="#333333" text-anchor="middle">Below the 0.40 threshold, so the router drops this route and answers with another.</text>

  <text x="380" y="315" font-size="11" fill="#333333" text-anchor="middle" font-style="italic">aggregation="max" would keep 0.816 and let the route pass.</text>
</svg>
