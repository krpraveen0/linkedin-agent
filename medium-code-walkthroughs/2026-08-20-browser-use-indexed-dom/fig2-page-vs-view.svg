<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
  <text x="390" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#333333">The page you wrote vs. the view the model gets</text>

  <!-- Left panel: the page -->
  <rect x="30" y="55" width="320" height="270" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <text x="190" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">Rendered page (6 elements)</text>
  <rect x="55" y="95" width="120" height="30" rx="4" fill="#e0e0e0" stroke="#333333"/>
  <text x="115" y="115" font-size="12" text-anchor="middle" fill="#333333">Pay now</text>
  <text x="55" y="150" font-size="12" fill="#333333" text-decoration="underline">Read the terms</text>
  <rect x="55" y="162" width="200" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="63" y="181" font-size="12" fill="#333333">Coupon code</text>
  <rect x="55" y="202" width="120" height="30" rx="4" fill="#e0e0e0" stroke="#333333"/>
  <text x="115" y="222" font-size="12" text-anchor="middle" fill="#333333">Gift wrap</text>
  <rect x="55" y="244" width="130" height="30" rx="4" fill="#e0e0e0" stroke="#333333" stroke-dasharray="4 2"/>
  <text x="120" y="264" font-size="12" text-anchor="middle" fill="#333333">Apply discount</text>
  <text x="55" y="300" font-size="11" fill="#333333">( + 1 hidden admin button )</text>

  <!-- Arrow -->
  <line x1="360" y1="190" x2="415" y2="190" stroke="#333333" stroke-width="1.5"/>
  <polygon points="415,190 405,185 405,195" fill="#333333"/>
  <text x="388" y="180" font-size="10" text-anchor="middle" fill="#333333">serialize</text>

  <!-- Right panel: the serialized view -->
  <rect x="430" y="55" width="320" height="270" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.2"/>
  <text x="590" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">llm_representation() output</text>
  <rect x="448" y="92" width="284" height="215" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="460" y="116" font-size="12.5" fill="#333333" font-family="monospace">Checkout</text>
  <text x="460" y="140" font-size="12.5" fill="#333333" font-family="monospace">[19]&lt;button&gt; Pay now</text>
  <text x="460" y="164" font-size="12.5" fill="#333333" font-family="monospace">[24]&lt;a&gt; Read the terms</text>
  <text x="460" y="188" font-size="12.5" fill="#333333" font-family="monospace">[2]&lt;input coupon&gt;</text>
  <text x="460" y="212" font-size="12.5" fill="#333333" font-family="monospace">Apply discount</text>
  <text x="460" y="236" font-size="12.5" fill="#333333" font-family="monospace">[4]&lt;div&gt; Gift wrap</text>
  <text x="460" y="285" font-size="11" fill="#333333">4 indexed &#183; 1 as bare text &#183; 1 gone</text>

  <text x="390" y="345" font-size="11" text-anchor="middle" fill="#333333">"Apply discount" survives as text but has no [N] &#8212; the agent cannot click it. The hidden button is absent.</text>
</svg>
