<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
  <text x="360" y="30" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">retries={'tools': 3, 'output': 1} — two independent pools</text>

  <rect x="60" y="60" width="260" height="210" rx="8" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="86" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">tools budget</text>
  <text x="190" y="106" font-size="12" fill="#333333" text-anchor="middle">tracked PER tool (own counter)</text>
  <rect x="90" y="120" width="200" height="34" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="190" y="142" font-size="12" fill="#333333" text-anchor="middle">tool ModelRetry / bad args</text>
  <text x="190" y="182" font-size="12" fill="#333333" text-anchor="middle">exhaust -&gt; UnexpectedModelBehavior:</text>
  <text x="190" y="200" font-size="11" fill="#333333" text-anchor="middle">"Tool 'lookup' exceeded max</text>
  <text x="190" y="216" font-size="11" fill="#333333" text-anchor="middle">retries count of 3"</text>
  <text x="190" y="250" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">default: 1</text>

  <rect x="400" y="60" width="260" height="210" rx="8" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="86" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">output budget</text>
  <text x="530" y="106" font-size="12" fill="#333333" text-anchor="middle">ONE global pool for the run</text>
  <rect x="430" y="120" width="200" height="34" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="530" y="142" font-size="12" fill="#333333" text-anchor="middle">output validator ModelRetry</text>
  <text x="530" y="182" font-size="12" fill="#333333" text-anchor="middle">exhaust -&gt; UnexpectedModelBehavior:</text>
  <text x="530" y="200" font-size="11" fill="#333333" text-anchor="middle">"Exceeded maximum output</text>
  <text x="530" y="216" font-size="11" fill="#333333" text-anchor="middle">retries (N)"</text>
  <text x="530" y="250" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">default: 1</text>

  <text x="360" y="298" font-size="12" fill="#333333" text-anchor="middle">A bare int sets both; a dict sets only the keys it names. The two never share a counter.</text>
</svg>
