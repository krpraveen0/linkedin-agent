<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">How Pydantic AI turns a validation failure into another model turn</text>

  <rect x="40" y="110" width="150" height="70" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="140" font-size="14" fill="#333333" text-anchor="middle">Model</text>
  <text x="115" y="160" font-size="12" fill="#333333" text-anchor="middle">(returns output)</text>

  <rect x="285" y="110" width="150" height="70" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="140" font-size="14" fill="#333333" text-anchor="middle">Output validator</text>
  <text x="360" y="160" font-size="12" fill="#333333" text-anchor="middle">raise ModelRetry?</text>

  <rect x="530" y="110" width="150" height="70" rx="6" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="605" y="140" font-size="14" fill="#333333" text-anchor="middle">Final output</text>
  <text x="605" y="160" font-size="12" fill="#333333" text-anchor="middle">(validation passed)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
  <line x1="190" y1="145" x2="283" y2="145" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="145" x2="528" y2="145" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="482" y="135" font-size="12" fill="#333333" text-anchor="middle">pass</text>

  <path d="M360,180 L360,240 L115,240 L115,182" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="150" y="222" width="290" height="36" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="295" y="238" font-size="12" fill="#333333" text-anchor="middle">RetryPromptPart(content = your exception text)</text>
  <text x="295" y="252" font-size="11" fill="#333333" text-anchor="middle">sent back to the model — counts against a budget</text>
</svg>
