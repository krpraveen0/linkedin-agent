<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <text x="320" y="28" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">What a KNN query touches: stable scan vs alpha graph index</text>

  <!-- divider -->
  <line x1="320" y1="50" x2="320" y2="340" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- LEFT: brute force -->
  <text x="160" y="66" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">Stable v0.1.9: brute force</text>
  <!-- query -->
  <rect x="30" y="150" width="70" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1.2"/>
  <text x="65" y="175" font-size="12" fill="#333333" text-anchor="middle">query</text>
  <!-- rows column -->
  <g>
    <rect x="200" y="88" width="90" height="24" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <rect x="200" y="120" width="90" height="24" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <rect x="200" y="152" width="90" height="24" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <rect x="200" y="184" width="90" height="24" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <rect x="200" y="216" width="90" height="24" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <text x="245" y="245" font-size="14" fill="#333333" text-anchor="middle">...</text>
    <rect x="200" y="252" width="90" height="24" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <text x="245" y="104" font-size="11" fill="#333333" text-anchor="middle">row 1</text>
    <text x="245" y="136" font-size="11" fill="#333333" text-anchor="middle">row 2</text>
    <text x="245" y="168" font-size="11" fill="#333333" text-anchor="middle">row 3</text>
    <text x="245" y="200" font-size="11" fill="#333333" text-anchor="middle">row 4</text>
    <text x="245" y="232" font-size="11" fill="#333333" text-anchor="middle">row 5</text>
    <text x="245" y="268" font-size="11" fill="#333333" text-anchor="middle">row N</text>
  </g>
  <!-- arrows from query to every row -->
  <g stroke="#333333" stroke-width="1" fill="none">
    <line x1="100" y1="168" x2="198" y2="100"/>
    <line x1="100" y1="168" x2="198" y2="132"/>
    <line x1="100" y1="168" x2="198" y2="164"/>
    <line x1="100" y1="170" x2="198" y2="196"/>
    <line x1="100" y1="170" x2="198" y2="228"/>
    <line x1="100" y1="172" x2="198" y2="264"/>
  </g>
  <text x="160" y="308" font-size="13" fill="#333333" text-anchor="middle">distance computed for ALL N rows</text>
  <text x="160" y="326" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">O(n) — exact top-k</text>

  <!-- RIGHT: DiskANN graph -->
  <text x="480" y="66" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">Alpha v0.1.10: DiskANN graph</text>
  <rect x="360" y="150" width="70" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1.2"/>
  <text x="395" y="175" font-size="12" fill="#333333" text-anchor="middle">query</text>
  <!-- graph nodes -->
  <g>
    <circle cx="500" cy="110" r="14" fill="#c9c9c9" stroke="#333333" stroke-width="1.2"/>
    <circle cx="560" cy="150" r="14" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <circle cx="500" cy="180" r="14" fill="#c9c9c9" stroke="#333333" stroke-width="1.2"/>
    <circle cx="575" cy="210" r="14" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <circle cx="500" cy="245" r="14" fill="#c9c9c9" stroke="#333333" stroke-width="1.2"/>
    <circle cx="450" cy="215" r="14" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
    <!-- edges -->
    <g stroke="#333333" stroke-width="1" fill="none">
      <line x1="500" y1="124" x2="500" y2="166"/>
      <line x1="514" y1="110" x2="546" y2="150"/>
      <line x1="500" y1="194" x2="500" y2="231"/>
      <line x1="514" y1="180" x2="561" y2="210"/>
      <line x1="486" y1="245" x2="464" y2="215"/>
    </g>
  </g>
  <!-- query enters graph at one node -->
  <line x1="430" y1="170" x2="486" y2="180" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="308" font-size="13" fill="#333333" text-anchor="middle">walks a few nodes (shaded), skips most</text>
  <text x="480" y="326" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">faster query, approximate result</text>
</svg>
