<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">Same function, two schemas: which parameters become "required"</text>

  <!-- Left: strict (default) -->
  <rect x="30" y="56" width="300" height="212" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="180" y="80" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">strict mode (default)</text>
  <line x1="46" y1="92" x2="314" y2="92" stroke="#333333" stroke-width="1"/>

  <text x="180" y="114" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">required:</text>
  <rect x="60" y="126" width="240" height="26" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1"/>
  <text x="180" y="144" font-size="12" fill="#333333" text-anchor="middle" font-family="monospace">origin, destination,</text>
  <rect x="60" y="158" width="240" height="26" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1"/>
  <text x="180" y="176" font-size="12" fill="#333333" text-anchor="middle" font-family="monospace">max_price, nonstop</text>
  <text x="180" y="208" font-size="12" fill="#333333" text-anchor="middle">defaulted params ARE required</text>
  <text x="180" y="230" font-size="12" fill="#333333" text-anchor="middle" font-family="monospace">additionalProperties: false</text>
  <text x="180" y="254" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Model must send all 4</text>

  <!-- Right: strict_mode=False -->
  <rect x="390" y="56" width="300" height="212" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="540" y="80" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">strict_mode = False</text>
  <line x1="406" y1="92" x2="674" y2="92" stroke="#333333" stroke-width="1"/>

  <text x="540" y="114" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">required:</text>
  <rect x="420" y="126" width="240" height="26" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1"/>
  <text x="540" y="144" font-size="12" fill="#333333" text-anchor="middle" font-family="monospace">origin, destination</text>
  <rect x="420" y="158" width="240" height="26" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="540" y="176" font-size="12" fill="#333333" text-anchor="middle" font-family="monospace">(max_price, nonstop optional)</text>
  <text x="540" y="208" font-size="12" fill="#333333" text-anchor="middle">defaulted params are optional</text>
  <text x="540" y="230" font-size="12" fill="#333333" text-anchor="middle" font-family="monospace">additionalProperties: absent</text>
  <text x="540" y="254" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Model may send just 2</text>

  <text x="360" y="288" font-size="11" fill="#333333" text-anchor="middle" font-style="italic">Both built from the identical Python signature.</text>
</svg>
