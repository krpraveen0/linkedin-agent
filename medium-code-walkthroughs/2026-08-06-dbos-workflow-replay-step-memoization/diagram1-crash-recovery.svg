<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
  <text x="350" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">Crash and recovery: what runs in each process</text>

  <!-- Lane 1 -->
  <rect x="40" y="55" width="270" height="380" fill="#f7f7f7" stroke="#333333" stroke-width="1"/>
  <text x="175" y="78" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Run 1  (pid 6950)</text>

  <!-- Lane 2 -->
  <rect x="390" y="55" width="270" height="380" fill="#f7f7f7" stroke="#333333" stroke-width="1"/>
  <text x="525" y="78" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Run 2  recovered (pid 6962)</text>

  <!-- Run 1 events -->
  <rect x="65" y="95"  width="220" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="175" y="117" font-size="13" fill="#333333" text-anchor="middle">BODY  start</text>

  <rect x="65" y="137" width="220" height="34" fill="#e0e0e0" stroke="#333333" stroke-width="1.3"/>
  <text x="175" y="159" font-size="13" fill="#333333" text-anchor="middle">STEP  plan  &#8594; checkpointed</text>

  <rect x="65" y="179" width="220" height="34" fill="#e0e0e0" stroke="#333333" stroke-width="1.3"/>
  <text x="175" y="201" font-size="13" fill="#333333" text-anchor="middle">STEP  gather  &#8594; checkpointed</text>

  <rect x="65" y="221" width="220" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="175" y="243" font-size="13" fill="#333333" text-anchor="middle">BODY  after gather</text>

  <!-- crash marker -->
  <rect x="65" y="263" width="220" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="175" y="285" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">os._exit(1)  &#10007;  CRASH</text>

  <!-- Run 2 events -->
  <rect x="415" y="95"  width="220" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="525" y="117" font-size="13" fill="#333333" text-anchor="middle">BODY  start   (runs again)</text>

  <rect x="415" y="137" width="220" height="34" fill="#e0e0e0" stroke="#888888" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="525" y="153" font-size="12" fill="#666666" text-anchor="middle">STEP  plan   SKIPPED</text>
  <text x="525" y="167" font-size="11" fill="#666666" text-anchor="middle">(memoized output returned)</text>

  <rect x="415" y="179" width="220" height="34" fill="#e0e0e0" stroke="#888888" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="525" y="195" font-size="12" fill="#666666" text-anchor="middle">STEP  gather   SKIPPED</text>
  <text x="525" y="209" font-size="11" fill="#666666" text-anchor="middle">(returns 28 from disk)</text>

  <rect x="415" y="221" width="220" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="525" y="243" font-size="13" fill="#333333" text-anchor="middle">BODY  after gather   (runs again)</text>

  <rect x="415" y="263" width="220" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
  <text x="525" y="285" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">STEP  write   (the only new work)</text>

  <rect x="415" y="305" width="220" height="34" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="525" y="327" font-size="13" fill="#333333" text-anchor="middle">BODY  done  &#8594; SUCCESS</text>

  <!-- recovery arrow -->
  <line x1="310" y1="280" x2="390" y2="112" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="205" font-size="11" fill="#333333" text-anchor="middle" transform="rotate(-63 350 205)">DBOS.launch() recovers</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="40" y="448" width="16" height="12" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="62" y="458" font-size="12" fill="#333333">workflow body: replayed every time</text>
  <rect x="360" y="448" width="16" height="12" fill="#e0e0e0" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="382" y="458" font-size="12" fill="#333333">completed step: checkpointed, never re-run</text>
</svg>
