<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <!-- Signature box -->
  <rect x="20" y="70" width="200" height="150" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="120" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Signature</text>
  <line x1="35" y1="105" x2="205" y2="105" stroke="#333333" stroke-width="1"/>
  <text x="35" y="128" font-size="12" fill="#333333">InputField:</text>
  <text x="45" y="146" font-size="12" fill="#333333">ticket (str)</text>
  <text x="35" y="176" font-size="12" fill="#333333">OutputField:</text>
  <text x="45" y="194" font-size="12" fill="#333333">urgency (str)</text>

  <!-- Adapter box -->
  <rect x="290" y="105" width="150" height="80" rx="6" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="365" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">ChatAdapter</text>
  <text x="365" y="162" font-size="11" text-anchor="middle" fill="#333333">(the default)</text>

  <!-- Prompt box -->
  <rect x="510" y="40" width="230" height="280" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="625" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#333333">Prompt sent to the LLM</text>
  <line x1="525" y1="72" x2="725" y2="72" stroke="#333333" stroke-width="1"/>
  <text x="525" y="94" font-size="12" font-family="monospace" fill="#333333">[[ ## ticket ## ]]</text>
  <text x="525" y="112" font-size="12" font-family="monospace" fill="#333333">{ticket}</text>
  <text x="525" y="138" font-size="12" font-family="monospace" fill="#333333">[[ ## reasoning ## ]]</text>
  <text x="525" y="156" font-size="12" font-family="monospace" fill="#333333">{reasoning}</text>
  <text x="525" y="182" font-size="12" font-family="monospace" fill="#333333">[[ ## urgency ## ]]</text>
  <text x="525" y="200" font-size="12" font-family="monospace" fill="#333333">{urgency}</text>
  <text x="525" y="226" font-size="12" font-family="monospace" fill="#333333">[[ ## completed ## ]]</text>
  <text x="525" y="262" font-size="11" fill="#333333">Text markers —</text>
  <text x="525" y="280" font-size="11" fill="#333333">not a JSON schema.</text>
  <text x="525" y="304" font-size="11" font-style="italic" fill="#333333">reasoning added by</text>
  <text x="525" y="318" font-size="11" font-style="italic" fill="#333333">ChainOfThought</text>

  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
  <line x1="220" y1="145" x2="288" y2="145" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="145" x2="508" y2="145" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
