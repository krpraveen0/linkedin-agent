<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="330" fill="#ffffff"/>
  <text x="330" y="30" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">or_() races its triggers; and_() waits for all</text>

  <!-- Start methods -->
  <rect x="40" y="90" width="150" height="46" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="112" font-size="13" fill="#333333" text-anchor="middle">@start fast()</text>
  <text x="115" y="128" font-size="11" fill="#333333" text-anchor="middle">emits "fast-done" (1st)</text>

  <rect x="40" y="200" width="150" height="46" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="222" font-size="13" fill="#333333" text-anchor="middle">@start slow()</text>
  <text x="115" y="238" font-size="11" fill="#333333" text-anchor="middle">emits "slow-done" (2nd)</text>

  <!-- Handlers -->
  <rect x="440" y="90" width="180" height="46" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="112" font-size="13" fill="#333333" text-anchor="middle">@listen(or_(fast, slow))</text>
  <text x="530" y="128" font-size="11" fill="#333333" text-anchor="middle">on_any — fires 1×, gets "fast-done"</text>

  <rect x="440" y="200" width="180" height="46" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="222" font-size="13" fill="#333333" text-anchor="middle">@listen(and_(fast, slow))</text>
  <text x="530" y="238" font-size="11" fill="#333333" text-anchor="middle">on_all — fires 1×, after both</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- fast -> on_any (winner, solid) -->
  <line x1="190" y1="108" x2="438" y2="110" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="300" y="98" font-size="11" fill="#333333" text-anchor="middle">winner triggers it</text>

  <!-- slow -> on_any (cancelled, dashed with X) -->
  <line x1="190" y1="218" x2="438" y2="124" stroke="#333333" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="322" y="186" font-size="11" fill="#333333" text-anchor="middle">cancelled (race lost)</text>
  <text x="330" y="171" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">✕</text>

  <!-- fast -> on_all -->
  <line x1="190" y1="118" x2="438" y2="212" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- slow -> on_all -->
  <line x1="190" y1="228" x2="438" y2="222" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="315" y="262" font-size="11" fill="#333333" text-anchor="middle">both required</text>
</svg>
