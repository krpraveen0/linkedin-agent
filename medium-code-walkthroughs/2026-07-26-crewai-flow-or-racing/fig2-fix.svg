<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="330" fill="#ffffff"/>
  <text x="330" y="28" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">To react to every branch, don't share an or_() — split the listeners</text>

  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Top row: shared or_ -->
  <text x="40" y="62" font-size="13" font-weight="bold" fill="#333333">Shared or_(): 1 run total</text>
  <rect x="40" y="78" width="120" height="40" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="102" font-size="12" fill="#333333" text-anchor="middle">fast()</text>
  <rect x="40" y="128" width="120" height="40" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="152" font-size="12" fill="#333333" text-anchor="middle">slow()</text>

  <rect x="380" y="103" width="230" height="40" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="495" y="120" font-size="12" fill="#333333" text-anchor="middle">@listen(or_(fast, slow))</text>
  <text x="495" y="135" font-size="11" fill="#333333" text-anchor="middle">on_any — runs once (first branch)</text>

  <line x1="160" y1="98" x2="378" y2="118" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="160" y1="148" x2="378" y2="128" stroke="#333333" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="270" y="176" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">✕</text>

  <line x1="30" y1="196" x2="630" y2="196" stroke="#333333" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Bottom row: split listeners -->
  <text x="40" y="222" font-size="13" font-weight="bold" fill="#333333">One @listen per branch: 2 runs</text>
  <rect x="40" y="238" width="120" height="34" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="259" font-size="12" fill="#333333" text-anchor="middle">fast()</text>
  <rect x="40" y="282" width="120" height="34" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="303" font-size="12" fill="#333333" text-anchor="middle">slow()</text>

  <rect x="380" y="238" width="230" height="34" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="495" y="259" font-size="12" fill="#333333" text-anchor="middle">@listen("fast") on_fast — runs</text>
  <rect x="380" y="282" width="230" height="34" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="495" y="303" font-size="12" fill="#333333" text-anchor="middle">@listen("slow") on_slow — runs</text>

  <line x1="160" y1="255" x2="378" y2="255" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="160" y1="299" x2="378" y2="299" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow2)"/>
</svg>
