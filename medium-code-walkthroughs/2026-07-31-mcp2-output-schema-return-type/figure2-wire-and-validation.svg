<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="360" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">What a structured tool result carries, and where a bad return dies</text>

  <!-- tool body -->
  <rect x="30" y="70" width="150" height="70" rx="4" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="105" y="98" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">tool body</text>
  <text x="105" y="118" font-size="12" fill="#333333" text-anchor="middle">returns a value</text>

  <!-- arrow to gate -->
  <line x1="180" y1="105" x2="225" y2="105" stroke="#333333" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- validation gate -->
  <rect x="228" y="62" width="170" height="86" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="313" y="88" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">validation gate</text>
  <text x="313" y="108" font-size="11.5" fill="#333333" text-anchor="middle">output_model</text>
  <text x="313" y="124" font-size="11.5" fill="#333333" text-anchor="middle">.model_validate(result)</text>
  <text x="313" y="141" font-size="11" fill="#333333" text-anchor="middle">(convert_result)</text>

  <!-- pass arrow -->
  <line x1="398" y1="90" x2="470" y2="90" stroke="#333333" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="434" y="82" font-size="11.5" fill="#333333" text-anchor="middle">valid</text>

  <!-- fail arrow down -->
  <line x1="313" y1="148" x2="313" y2="235" stroke="#333333" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="345" y="195" font-size="11.5" fill="#333333" text-anchor="middle">invalid</text>

  <!-- result on the wire -->
  <rect x="470" y="58" width="220" height="150" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="580" y="80" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">CallToolResult on the wire</text>
  <line x1="482" y1="90" x2="678" y2="90" stroke="#e0e0e0" stroke-width="1"/>
  <text x="486" y="112" font-size="11.5" fill="#333333">content:  [ TextContent("5") ]</text>
  <text x="486" y="132" font-size="10.5" fill="#333333">   backwards-compat text block</text>
  <text x="486" y="158" font-size="11.5" fill="#333333">structuredContent:</text>
  <text x="500" y="177" font-size="11.5" fill="#333333" font-family="monospace">{ "result": 5 }</text>
  <text x="486" y="197" font-size="10.5" fill="#333333">   validated JSON object</text>

  <!-- error box -->
  <rect x="203" y="238" width="220" height="70" rx="4" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="313" y="264" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">ToolError raised at server</text>
  <text x="313" y="285" font-size="11" fill="#333333" text-anchor="middle">"1 validation error for DictModel"</text>
  <text x="313" y="301" font-size="11" fill="#333333" text-anchor="middle">client never receives bad data</text>

  <text x="360" y="338" font-size="12" fill="#333333" text-anchor="middle">Example: a tool typed  -&gt; int  returning 5. Both blocks are always sent when an outputSchema exists.</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
