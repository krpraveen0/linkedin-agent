<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>
  <text x="350" y="30" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">One step of the AI SDK tool loop</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Model generate -->
  <rect x="60" y="70" width="150" height="46" rx="4" fill="#e0e0e0" stroke="#333333"/>
  <text x="135" y="92" font-size="13" fill="#333333" text-anchor="middle">Model generates</text>
  <text x="135" y="108" font-size="11" fill="#333333" text-anchor="middle">one response</text>

  <line x1="210" y1="93" x2="270" y2="93" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Decision: tool calls? -->
  <polygon points="345,60 425,93 345,126 265,93" fill="#f0f0f0" stroke="#333333"/>
  <text x="345" y="90" font-size="12" fill="#333333" text-anchor="middle">Tool calls</text>
  <text x="345" y="105" font-size="12" fill="#333333" text-anchor="middle">in response?</text>

  <!-- No -> stop (right) -->
  <line x1="425" y1="93" x2="500" y2="93" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="462" y="85" font-size="11" fill="#333333" text-anchor="middle">no</text>
  <rect x="500" y="70" width="140" height="46" rx="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="570" y="92" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Return</text>
  <text x="570" y="108" font-size="11" fill="#333333" text-anchor="middle">finishReason: stop</text>

  <!-- Yes -> execute tools (down) -->
  <line x1="345" y1="126" x2="345" y2="170" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="356" y="152" font-size="11" fill="#333333" text-anchor="start">yes</text>
  <rect x="270" y="172" width="150" height="46" rx="4" fill="#f0f0f0" stroke="#333333"/>
  <text x="345" y="194" font-size="13" fill="#333333" text-anchor="middle">Execute tools,</text>
  <text x="345" y="210" font-size="11" fill="#333333" text-anchor="middle">append results</text>

  <!-- down to stopWhen gate -->
  <line x1="345" y1="218" x2="345" y2="255" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <polygon points="345,257 435,295 345,333 255,295" fill="#f0f0f0" stroke="#333333"/>
  <text x="345" y="291" font-size="12" fill="#333333" text-anchor="middle">stopWhen</text>
  <text x="345" y="306" font-size="12" fill="#333333" text-anchor="middle">met?</text>

  <!-- stopWhen met -> stop -->
  <line x1="435" y1="295" x2="500" y2="295" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="467" y="287" font-size="11" fill="#333333" text-anchor="middle">yes</text>
  <rect x="500" y="272" width="150" height="46" rx="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="575" y="294" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Return</text>
  <text x="575" y="310" font-size="11" fill="#333333" text-anchor="middle">finishReason: tool-calls</text>

  <!-- stopWhen not met -> loop back up to model (left side) -->
  <path d="M255,295 H70 V116" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="150" y="288" font-size="11" fill="#333333" text-anchor="middle">no — next step</text>

  <!-- default note -->
  <text x="350" y="360" font-size="12" fill="#333333" text-anchor="middle">Default stopWhen: isStepCount(1) for generateText, isStepCount(20) for the Agent class</text>
</svg>
