<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="250" fill="#ffffff"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">max_runs_per_component = 3: three runs, then the fourth scheduling raises</text>
  <text x="380" y="50" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">the check is visits &gt;= limit, evaluated before the component runs</text>

  <!-- run 0 -->
  <rect x="40" y="80" width="150" height="70" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="105" font-size="12" fill="#333333" text-anchor="middle">visits = 0  &lt; 3</text>
  <text x="115" y="125" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">run (value 0)</text>
  <text x="115" y="142" font-size="11" fill="#333333" text-anchor="middle">visits -&gt; 1</text>
  <line x1="190" y1="115" x2="214" y2="115" stroke="#333333" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- run 1 -->
  <rect x="216" y="80" width="150" height="70" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="291" y="105" font-size="12" fill="#333333" text-anchor="middle">visits = 1  &lt; 3</text>
  <text x="291" y="125" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">run (value 1)</text>
  <text x="291" y="142" font-size="11" fill="#333333" text-anchor="middle">visits -&gt; 2</text>
  <line x1="366" y1="115" x2="390" y2="115" stroke="#333333" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- run 2 -->
  <rect x="392" y="80" width="150" height="70" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="467" y="105" font-size="12" fill="#333333" text-anchor="middle">visits = 2  &lt; 3</text>
  <text x="467" y="125" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">run (value 2)</text>
  <text x="467" y="142" font-size="11" fill="#333333" text-anchor="middle">visits -&gt; 3</text>
  <line x1="542" y1="115" x2="566" y2="115" stroke="#333333" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- attempt 4 -->
  <rect x="568" y="80" width="160" height="70" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <text x="648" y="105" font-size="12" fill="#333333" text-anchor="middle">visits = 3  &gt;= 3</text>
  <text x="648" y="125" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">RAISE</text>
  <text x="648" y="142" font-size="10.5" fill="#333333" text-anchor="middle">PipelineMaxComponentRuns</text>

  <text x="384" y="185" font-size="12" fill="#333333" text-anchor="middle">Worker.run executed 3 times; values seen: [0, 1, 2]</text>
  <text x="384" y="210" font-size="11" fill="#333333" text-anchor="middle" font-style="italic">An Agent hitting max_agent_steps at this same boundary would instead log a warning and return.</text>

  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
