<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">How pydantic-evals routes an evaluator's return value</text>

  <!-- return value box -->
  <rect x="40" y="150" width="180" height="60" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="130" y="176" font-size="13" fill="#333333" text-anchor="middle">evaluator returns</text>
  <text x="130" y="196" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">a scalar value</text>

  <!-- type check diamond -->
  <polygon points="330,180 400,140 470,180 400,220" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="177" font-size="12" fill="#333333" text-anchor="middle">check the</text>
  <text x="400" y="193" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Python type</text>

  <!-- arrow value -> diamond -->
  <line x1="220" y1="180" x2="328" y2="180" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- three buckets -->
  <rect x="560" y="60" width="170" height="56" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="645" y="83" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Assertions</text>
  <text x="645" y="102" font-size="12" fill="#333333" text-anchor="middle">pass / fail, pass rate</text>

  <rect x="560" y="152" width="170" height="56" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="645" y="175" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Scores</text>
  <text x="645" y="194" font-size="12" fill="#333333" text-anchor="middle">numbers, averaged</text>

  <rect x="560" y="244" width="170" height="56" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="645" y="267" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Labels</text>
  <text x="645" y="286" font-size="12" fill="#333333" text-anchor="middle">categories, tallied</text>

  <!-- edges from diamond to buckets with type labels -->
  <line x1="470" y1="172" x2="558" y2="90" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="512" y="120" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">bool</text>

  <line x1="470" y1="180" x2="558" y2="180" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="514" y="170" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">int / float</text>

  <line x1="470" y1="188" x2="558" y2="270" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="512" y="245" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">str</text>

  <!-- note about True vs 1 -->
  <rect x="40" y="270" width="440" height="56" fill="#ffffff" stroke="#333333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="60" y="292" font-size="12" fill="#333333">Even though 1 == True in Python, True takes the bool path</text>
  <text x="60" y="310" font-size="12" fill="#333333">and 1 takes the int path. The type alone decides the bucket.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
