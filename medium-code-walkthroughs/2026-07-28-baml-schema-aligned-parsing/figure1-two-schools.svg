<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">Two schools of structured output</text>

  <!-- Row A: Constrained generation -->
  <text x="24" y="78" font-size="14" font-weight="bold" fill="#333333">Constrain the tokens (XGrammar, strict JSON mode)</text>
  <rect x="24" y="92" width="150" height="52" rx="4" fill="#f0f0f0" stroke="#333333"/>
  <text x="99" y="115" text-anchor="middle" font-size="13" fill="#333333">Model</text>
  <text x="99" y="133" text-anchor="middle" font-size="12" fill="#333333">generates</text>

  <rect x="214" y="92" width="150" height="52" rx="4" fill="#e0e0e0" stroke="#333333"/>
  <text x="289" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">schema = FSM</text>
  <text x="289" y="130" text-anchor="middle" font-size="12" fill="#333333">masks bad tokens</text>

  <rect x="404" y="92" width="150" height="52" rx="4" fill="#f0f0f0" stroke="#333333"/>
  <text x="479" y="115" text-anchor="middle" font-size="13" fill="#333333">Always-valid</text>
  <text x="479" y="133" text-anchor="middle" font-size="12" fill="#333333">JSON string</text>

  <rect x="594" y="92" width="142" height="52" rx="4" fill="#f0f0f0" stroke="#333333"/>
  <text x="665" y="115" text-anchor="middle" font-size="13" fill="#333333">json.loads()</text>
  <text x="665" y="133" text-anchor="middle" font-size="12" fill="#333333">Typed object</text>

  <line x1="174" y1="118" x2="212" y2="118" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="364" y1="118" x2="402" y2="118" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="554" y1="118" x2="592" y2="118" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="620" y="168" text-anchor="middle" font-size="11" fill="#333333">needs logit access</text>

  <line x1="24" y1="200" x2="736" y2="200" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Row B: SAP -->
  <text x="24" y="238" font-size="14" font-weight="bold" fill="#333333">Parse the mess (BAML Schema-Aligned Parsing)</text>
  <rect x="24" y="252" width="150" height="52" rx="4" fill="#f0f0f0" stroke="#333333"/>
  <text x="99" y="275" text-anchor="middle" font-size="13" fill="#333333">Model</text>
  <text x="99" y="293" text-anchor="middle" font-size="12" fill="#333333">reasons freely</text>

  <rect x="214" y="252" width="150" height="52" rx="4" fill="#f0f0f0" stroke="#333333"/>
  <text x="289" y="275" text-anchor="middle" font-size="12" fill="#333333">Prose + fenced</text>
  <text x="289" y="293" text-anchor="middle" font-size="12" fill="#333333">malformed JSON</text>

  <rect x="404" y="252" width="150" height="52" rx="4" fill="#e0e0e0" stroke="#333333"/>
  <text x="479" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">SAP</text>
  <text x="479" y="290" text-anchor="middle" font-size="11" fill="#333333">schema-guided parse</text>

  <rect x="594" y="252" width="142" height="52" rx="4" fill="#f0f0f0" stroke="#333333"/>
  <text x="665" y="275" text-anchor="middle" font-size="13" fill="#333333">Typed object</text>
  <text x="665" y="293" text-anchor="middle" font-size="11" fill="#333333">(any model)</text>

  <line x1="174" y1="278" x2="212" y2="278" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="364" y1="278" x2="402" y2="278" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="554" y1="278" x2="592" y2="278" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="479" y="328" text-anchor="middle" font-size="11" fill="#333333">schema applied after generation, no logit access</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
