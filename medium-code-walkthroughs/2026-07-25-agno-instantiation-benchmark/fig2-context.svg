<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="30" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">Construction cost vs. one LLM call (800 ms)</text>
  <text x="360" y="52" font-size="13" fill="#333333" text-anchor="middle">The instantiation race is a rounding error inside a real request</text>

  <!-- Full bar representing one 800ms LLM call -->
  <text x="40" y="100" font-size="13" fill="#333333">One LLM call</text>
  <rect x="150" y="86" width="520" height="26" fill="#e0e0e0" stroke="#333333" stroke-width="1.5"/>
  <text x="410" y="104" font-size="12" fill="#333333" text-anchor="middle">800 ms</text>

  <!-- LangGraph construct -->
  <text x="40" y="150" font-size="13" fill="#333333">LangGraph build</text>
  <rect x="150" y="136" width="2" height="26" fill="#333333" stroke="#333333" stroke-width="1.5"/>
  <text x="165" y="154" font-size="12" fill="#333333">2.79 ms  =  0.35% of the call</text>

  <!-- Agno construct -->
  <text x="40" y="196" font-size="13" fill="#333333">Agno build</text>
  <rect x="150" y="182" width="1" height="26" fill="#333333" stroke="#333333" stroke-width="1"/>
  <text x="165" y="200" font-size="12" fill="#333333">0.009 ms  =  0.001% of the call (not visible at this scale)</text>

  <!-- scale note -->
  <line x1="150" y1="230" x2="670" y2="230" stroke="#333333" stroke-width="1"/>
  <text x="150" y="248" font-size="11" fill="#333333">0 ms</text>
  <text x="640" y="248" font-size="11" fill="#333333">800 ms</text>

  <text x="360" y="282" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">Agent objects are built once and reused across many model calls, so this cost amortizes toward zero.</text>
</svg>
